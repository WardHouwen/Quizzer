<style>
/* Layout: teacher workspace = paper sheet with a chalkboard-green accent; game screens = full-bleed chalkboard stage */
:root {
  --paper: #f3f5f2;
  --surface: #ffffff;
  --ink: #18221f;
  --muted: #5a6762;
  --line: #d9e0dc;
  --accent: #1d6b57;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe8;
  --danger: #b8382a;
  --danger-soft: #fbe5e1;
  --ok: #1f8a4c;
  --board: #183a33;
  --board-2: #21493f;
  --chalk: #f4f1e6;
  --chalk-dim: #b9c7bf;
  --a: #e85d43; --b: #2f7fd1; --c: #e8a920; --d: #6a5acd;
  --right: #2aa45d; --wrong: #d2463a;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111816; --surface: #19221f; --ink: #e8eeeb; --muted: #9aa9a3; --line: #2c3834;
    --accent: #5cc2a4; --accent-ink: #0d1f1a; --accent-soft: #1c3a32; --danger: #f08070; --danger-soft: #3a1f1b; --ok: #5cd08c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111816; --surface: #19221f; --ink: #e8eeeb; --muted: #9aa9a3; --line: #2c3834;
  --accent: #5cc2a4; --accent-ink: #0d1f1a; --accent-soft: #1c3a32; --danger: #f08070; --danger-soft: #3a1f1b; --ok: #5cd08c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 2rem; font-weight: 800; }
h2 { font-size: 1.4rem; font-weight: 800; }
h3 { font-size: 1.1rem; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--muted); }
[hidden] { display: none !important; }

/* Buttons & fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface);
  padding: 9px 16px; border-radius: var(--r); cursor: pointer; font-weight: 700; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.big { padding: 14px 24px; font-size: 1.1rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.field { display: grid; gap: 6px; }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; }
textarea.input { resize: vertical; min-height: 70px; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 16px; }
.stack.tight { gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.chip.grey { background: var(--line); color: var(--muted); }
.chip.warn { background: var(--danger-soft); color: var(--danger); }

.shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 20px; min-height: 60px; flex-wrap: wrap; padding-block: 8px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; display: flex; align-items: center; gap: 8px; }
.brand-mark { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 22px; height: 22px; }
.brand-mark i { border-radius: 2px; }
.brand-mark i:nth-child(1){background:var(--a)} .brand-mark i:nth-child(2){background:var(--b)} .brand-mark i:nth-child(3){background:var(--c)} .brand-mark i:nth-child(4){background:var(--d)}
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav button { border: 0; background: transparent; padding: 8px 14px; border-radius: var(--r); cursor: pointer; font-weight: 700; color: var(--muted); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.who { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 0.875rem; color: var(--muted); min-width: 0; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.page { max-width: 1100px; width: 100%; margin: 0 auto; padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }

.subject { display: grid; gap: 12px; }
.subject + .subject { margin-top: 28px; }
.subject-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.subject-head h2 { margin-right: auto; }
.quiz-list { display: grid; gap: 8px; }
.quiz-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.quiz-row .t { font-weight: 700; margin-right: auto; min-width: 0; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 18px; color: var(--muted); text-align: center; }

/* Editor */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.qcard-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.qnum { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; margin-right: auto; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .opts { grid-template-columns: minmax(0, 1fr); } }
.opt { display: flex; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: var(--r); padding: 4px 8px 4px 4px; background: var(--surface); }
.opt.is-correct { border-color: var(--ok); }
.opt .sw { width: 32px; height: 32px; border-radius: 7px; display: grid; place-items: center; flex: none; }
.opt .sw svg { width: 16px; height: 16px; fill: #fff; }
.opt input[type="text"] { border: 0; background: transparent; flex: 1; min-width: 0; padding: 6px 2px; }
.opt input[type="text"]:focus { outline: none; }
.opt label { font-size: 0.8rem; display: flex; align-items: center; gap: 4px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.sw-0 { background: var(--a); } .sw-1 { background: var(--b); } .sw-2 { background: var(--c); } .sw-3 { background: var(--d); }
.savebar { position: sticky; bottom: 0; z-index: 4; margin-top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; box-shadow: 0 -6px 24px rgb(0 0 0 / 0.06);
  margin-bottom: env(safe-area-inset-bottom, 0px); }
.codebox { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; letter-spacing: 0.08em; }
.listline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
.listline:first-child { border-top: 0; }
.listline .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }

/* Tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); cursor: pointer; user-select: none; }
td.r, th.r { text-align: right; }
tr:last-child td { border-bottom: 0; }
.medal { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-weight: 800; font-size: 0.85rem; background: var(--line); }
.medal.m1 { background: #e8b923; color: #3a2a00; } .medal.m2 { background: #c3cbd1; color: #26313a; } .medal.m3 { background: #cf8a4f; color: #2e1700; }

/* Auth & landing */
.center { min-height: 100vh; display: grid; place-items: center; padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.landing { width: 100%; max-width: 980px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 760px) { .landing { grid-template-columns: minmax(0, 1fr); } }
.join-card { background: var(--board); color: var(--chalk); border-radius: 18px; padding: 32px; display: grid; gap: 18px; align-content: start; }
.join-card h1 { font-size: clamp(2rem, 6vw, 3.2rem); }
.code-input { font-family: var(--f-display); font-weight: 800; font-size: 2rem; letter-spacing: 0.3em; text-align: center; width: 100%;
  border-radius: 12px; border: 3px solid transparent; background: var(--chalk); color: var(--board); padding: 12px; }
.code-input:focus { outline: none; border-color: var(--c); }

/* Stage (game screens) */
.stage { min-height: 100vh; background: var(--board); color: var(--chalk); display: flex; flex-direction: column;
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-image: radial-gradient(ellipse at 20% 0%, rgb(255 255 255 / 0.06), transparent 60%); }
.stage .btn { background: var(--chalk); color: var(--board); border-color: var(--chalk); }
.stage .btn.ghost { background: transparent; color: var(--chalk); border-color: rgb(244 241 230 / 0.3); }
.stage-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-weight: 700; color: var(--chalk-dim); }
.stage-top .grow { flex: 1; }
.stage-main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 24px; width: 100%; max-width: 1200px; margin: 0 auto; padding-block: 16px; }
.stage h1 { font-size: clamp(1.8rem, 4.5vw, 3.4rem); }
.qtext { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.5rem, 4vw, 3rem); line-height: 1.15; text-align: center; text-wrap: balance; overflow-wrap: anywhere; }
.answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 520px) { .answers.phone { grid-template-columns: minmax(0, 1fr); } }
.ans { border: 0; border-radius: 14px; color: #fff; padding: 18px 20px; min-height: 84px; display: flex; align-items: center; gap: 14px;
  font-weight: 700; font-size: clamp(1.05rem, 2.2vw, 1.6rem); text-align: left; cursor: pointer; box-shadow: inset 0 -5px 0 rgb(0 0 0 / 0.2);
  transition: transform 0.08s ease, opacity 0.2s ease; overflow-wrap: anywhere; min-width: 0; }
.ans:active { transform: translateY(2px); }
.ans svg { width: 30px; height: 30px; fill: #fff; flex: none; }
.ans.dim { opacity: 0.28; }
.ans.win { outline: 5px solid var(--chalk); outline-offset: 3px; }
.ans[disabled] { cursor: default; }
.ans .cnt { margin-left: auto; font-family: var(--f-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.ans-0 { background: var(--a); } .ans-1 { background: var(--b); } .ans-2 { background: var(--c); } .ans-3 { background: var(--d); }
.timer { --p: 1; width: 100%; height: 10px; border-radius: 99px; background: rgb(255 255 255 / 0.12); overflow: hidden; }
.timer i { display: block; height: 100%; width: calc(var(--p) * 100%); background: var(--c); transition: width 0.25s linear; }
.bigclock { font-family: var(--f-display); font-weight: 800; font-size: 3rem; font-variant-numeric: tabular-nums; width: 96px; height: 96px; border-radius: 50%;
  display: grid; place-items: center; background: var(--chalk); color: var(--board); flex: none; }
.lobby { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: center; }

.joinurl { font-size: clamp(1rem, 2.4vw, 1.5rem); color: var(--chalk-dim); overflow-wrap: anywhere; }
.joinurl b { color: var(--chalk); }
.bigcode { font-family: var(--f-display); font-weight: 800; font-size: clamp(3.5rem, 12vw, 8rem); letter-spacing: 0.06em; line-height: 1; }
.qr { background: #fff; padding: 14px; border-radius: 14px; width: max-content; max-width: 100%; }

.names { display: flex; flex-wrap: wrap; gap: 8px; }
.names span { background: rgb(255 255 255 / 0.1); padding: 6px 14px; border-radius: 99px; font-weight: 700; animation: pop 0.3s ease; }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.feedback { border-radius: 18px; padding: 32px 24px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.feedback.good { background: var(--right); color: #fff; }
.feedback.bad { background: var(--wrong); color: #fff; }
.feedback.wait { background: var(--board-2); }
.feedback .huge { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.4rem, 9vw, 4.5rem); line-height: 1; }
.feedback svg { width: 64px; height: 64px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.scorepill { display: inline-flex; gap: 8px; align-items: baseline; background: rgb(0 0 0 / 0.25); padding: 6px 16px; border-radius: 99px; font-weight: 700; font-variant-numeric: tabular-nums; }
.namegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.namebtn { border: 2px solid rgb(244 241 230 / 0.25); background: var(--board-2); color: var(--chalk); padding: 16px 12px; border-radius: 12px;
  font-weight: 700; font-size: 1.05rem; cursor: pointer; overflow-wrap: anywhere; }
.namebtn:hover { border-color: var(--c); }
.stage .input { background: var(--chalk); color: var(--board); border-color: transparent; }
.board-list { display: grid; gap: 8px; max-width: 760px; width: 100%; margin: 0 auto; }
.board-row { display: flex; align-items: center; gap: 14px; background: var(--board-2); border-radius: 12px; padding: 12px 18px; font-size: clamp(1rem, 2.2vw, 1.4rem); font-weight: 700; }
.board-row .n { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.board-row .s { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

/* Podium */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 12px; max-width: 760px; width: 100%; margin: 0 auto; }
.pod { display: grid; gap: 8px; justify-items: center; text-align: center; min-width: 0; }
.pod .who-n { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.1rem, 3vw, 2rem); overflow-wrap: anywhere; }

  font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 6vw, 4rem); color: rgb(0 0 0 / 0.55);
  transform-origin: bottom; animation: rise 0.9s cubic-bezier(.2,.8,.2,1) both; }
.pod.p1 .block { height: 240px; background: #e8b923; animation-delay: 1.4s; }
.pod.p2 .block { height: 170px; background: #c3cbd1; animation-delay: 0.7s; }
.pod.p3 .block { height: 120px; background: #cf8a4f; animation-delay: 0s; }
.pod.p1 .who-n, .pod.p1 .pts { animation: fadein 0.5s ease 2.1s both; }
.pod.p2 .who-n, .pod.p2 .pts { animation: fadein 0.5s ease 1.4s both; }
.pod.p3 .who-n, .pod.p3 .pts { animation: fadein 0.5s ease 0.7s both; }
@keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (max-width: 520px) { .pod.p1 .block { height: 160px; } .pod.p2 .block { height: 115px; } .pod.p3 .block { height: 80px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.overlay { position: fixed; inset: 0; z-index: 50; overflow: auto; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 99;

@keyframes spin { to { transform: rotate(360deg); } }
details summary { cursor: pointer; font-weight: 700; }
pre.fmt { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; font-size: 0.85rem; overflow-x: auto; margin: 0; }
</style>

let loops = [];
function every(ms, fn) {
  let stop = false, t;
  const run = async () => { if (stop) return; try { await fn(); } catch (e) { console.error(e); } if (!stop) t = setTimeout(run, ms); };
  t = setTimeout(run, 0);
  const s = () => { stop = true; clearTimeout(t); };
  loops.push(s); return s;
}
function stopLoops() { loops.forEach(s => s()); loops = []; }
function store(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch (e) { return null; } }
function fmtDate(s) { if (!s) return ""; const d = new Date(s); return d.toLocaleDateString("nl-BE", { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString("nl-BE", { hour: "2-digit", minute: "2-digit" }); }
function fmtNum(n) { return Math.round(n).toLocaleString("nl-BE"); }
function joinUrl(code) { return location.origin + location.pathname + "?code=" + code; }
function isHosted() { return location.protocol.startsWith("http"); }
function confirmBtn(label, onConfirm, cls = "btn danger") {
  const b = h("button", { class: cls, type: "button" }, label);
  let armed = false, t;
  b.addEventListener("click", async () => {
    if (!armed) { armed = true; b.classList.add("armed"); b.textContent = "Zeker? Klik opnieuw"; t = setTimeout(() => { armed = false; b.classList.remove("armed"); b.textContent = label; }, 3000); return; }
    clearTimeout(t); b.disabled = true; await onConfirm(); b.disabled = false;
  });
  return b;
}
async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args);
  if (error) throw new Error(error.message);
  return data;
}
function must(res) { if (res.error) throw new Error(res.error.message); return res.data; }
function ansButton(i, text, extra = {}) {
  return h("button", Object.assign({ class: "ans ans-" + i, type: "button", "aria-label": LETTERS[i] + ": " + text }, extra),
    h("span", { html: SHAPES[i] }), h("span", null, text));
}
function podium(rows) {
  const top = [rows[1], rows[0], rows[2]];
  const cls = ["p2", "p1", "p3"], place = [2, 1, 3];
  return h("div", { class: "podium" }, top.map((r, i) => h("div", { class: "pod " + cls[i] },

function studentLive(ctx) {
  stopLoops();
  let key = "", deadline = 0, local = {};
  const topScore = h("span", { class: "scorepill" }, "0 punten");
  const holder = h("div", { class: "stack" });
  mount(stageShell([h("span", { class: "grow" }, ctx.name), topScore], holder));

  const render = (s) => {
    topScore.textContent = fmtNum(s.score) + " punten";
    if (s.error) { holder.replaceChildren(h("h1", null, s.error), h("button", { class: "btn big", onclick: () => { store("kq_play", null); landing(); } }, "Terug")); stopLoops(); return; }
    const answered = s.answered || local[s.question?.id] != null;
    const k = [s.status, s.index, answered ? 1 : 0].join(":");
    if (s.status === "question") deadline = Date.now() + s.remaining * 1000;
    if (k === key) return;
    key = k;
    if (s.status === "lobby") {
      holder.replaceChildren(h("div", { class: "feedback wait" },
        h("div", { class: "huge" }, "Je bent binnen!"),
        h("p", { style: { fontSize: "1.2rem" } }, "Kijk naar het bord. De quiz begint zo."),
        h("p", { class: "muted", style: { color: "var(--chalk-dim)" } }, s.players + " leerlingen doen mee")));
    } else if (s.status === "question" && !answered) {
      const bar = h("div", { class: "timer" }, h("i"));
      const q = s.question;
      const btns = q.options.map((o, i) => ansButton(i, o, { onclick: async () => {
        local[q.id] = i; key = ""; render(Object.assign({}, s, { answered: true }));
        try { const r = await rpc("kq2_live_answer", { p_token: ctx.token, p_question: q.id, p_choice: i }); if (r.error) toast(r.error, true); }
        catch (e) { toast("Je antwoord kwam niet door. Controleer je internet.", true); delete local[q.id]; key = ""; }
      } }));
      holder.replaceChildren(
        h("p", { class: "label", style: { color: "var(--chalk-dim)", textAlign: "center" } }, "Vraag " + (s.index + 1) + " van " + s.total),
        h("div", { class: "qtext", style: { fontSize: "clamp(1.3rem,5vw,2.2rem)" } }, q.text), bar,
        h("div", { class: "answers phone" }, btns));
      every(250, () => {
        const left = Math.max(0, deadline - Date.now());
        bar.style.setProperty("--p", Math.min(1, left / (q.time_limit * 1000)));
        if (left <= 0) btns.forEach(b => b.disabled = true);
      });
    } else if (s.status === "question") {
      holder.replaceChildren(h("div", { class: "feedback wait" },
        h("div", { class: "huge" }, "Antwoord ontvangen"),
        h("p", { style: { fontSize: "1.2rem" } }, "Even wachten tot iedereen geantwoord heeft…")));
    } else if (s.status === "reveal") {
      const good = s.was_correct;
      const right = s.question.options[s.correct_index];
      holder.replaceChildren(h("div", { class: "feedback " + (good ? "good" : "bad") },
        h("span", { html: good ? ICON_OK : ICON_NO }),
        h("div", { class: "huge" }, good ? "Juist!" : (s.answered ? "Fout" : "Te laat")),
        good ? h("p", { style: { fontSize: "1.4rem", fontWeight: 700 } }, "+" + fmtNum(s.points) + " punten")
             : h("p", { style: { fontSize: "1.2rem" } }, "Het juiste antwoord was: ", h("b", null, right)),
        h("span", { class: "scorepill" }, "Je staat op plaats " + s.rank + " van " + s.players)));
    } else if (s.status === "finished") {
      store("kq_play", null);
      holder.replaceChildren(h("div", { class: "feedback wait" },
        h("div", { class: "huge" }, "Plaats " + s.rank),
        h("p", { style: { fontSize: "1.3rem" } }, "Je haalde " + fmtNum(s.score) + " punten. Goed gedaan, " + ctx.name + "!")),
        h("div", { class: "row", style: { justifyContent: "center" } }, h("button", { class: "btn big", onclick: landing }, "Sluiten")));
      stopLoops();
    }
  };
  every(1000, async () => {
    const s = await rpc("kq2_live_state", { p_token: ctx.token });
    // keep the timer loop when re-rendering the same question
    render(s);
  });
}

/* ---------- Quiz editor ---------- */
function parseImport(text) {
  const blocks = text.replace(/\r/g, "").split(/\n\s*\n/).map(b => b.split("\n").map(l => l.trim()).filter(Boolean)).filter(b => b.length >= 3);
  return blocks.map(b => {
    const qtext = b[0].replace(/^\d+[\.\)]\s*/, "");
    let correct = 0;
    const options = b.slice(1, 5).map((l, i) => {
      let s = l;
      if (s.startsWith("*")) { correct = i; s = s.slice(1).trim(); }
      s = s.replace(/^([a-dA-D][\.\)]|-)\s*/, "");
      if (s.startsWith("*")) { correct = i; s = s.slice(1).trim(); }
      return s;
    });
    return { id: null, text: qtext, options: [...options, "", "", "", ""].slice(0, 4), correct, time_limit: 20 };
  });
}

  async function setState(status, i) { await rpc("kq2_host_set", { p_session: session.id, p_status: status, p_index: i }); }
  async function refreshPlayers() {
    const rows = must(await sb.from("kq_attempts").select("id, score, kq_students(name)").eq("session_id", session.id));
    players = rows.map(r => ({ id: r.id, score: r.score, name: r.kq_students ? r.kq_students.name : "?" })).sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
  }
  async function answersFor(qid) {
    const ids = players.map(p => p.id);
    if (!ids.length) return [];
    return must(await sb.from("kq_answers").select("chosen, attempt_id").eq("question_id", qid).in("attempt_id", ids));

  // Lobby

        isHosted() ? qrBox : null),
      h("div", { class: "row between" }, h("h2", null, count, " leerlingen doen mee"), startBtn),

    if (isHosted() && window.QRCode) { try { new QRCode(qrBox, { text: joinUrl(session.code), width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {} }
    let shown = new Set();
    every(1500, async () => {
      await refreshPlayers();
      count.textContent = players.length;

    main.replaceChildren(
      h("div", { class: "qtext" }, q.text),
      h("div", { class: "row between", style: { flexWrap: "nowrap" } }, clock,
        h("div", { style: { textAlign: "center" } }, answeredEl, h("div", { class: "label", style: { color: "var(--chalk-dim)" } }, "antwoorden")),
        h("button", { class: "btn ghost", type: "button", onclick: () => reveal(i) }, "Nu afsluiten")),
      h("div", { class: "answers" }, q.options.map((o, j) => ansButton(j, o, { disabled: true }))));
    every(250, () => { clock.textContent = Math.ceil(Math.max(0, deadline - Date.now()) / 1000); });
    every(1000, async () => {
      await refreshPlayers();
      const ans = await answersFor(q.id);
      answeredEl.textContent = ans.length + " / " + players.length;
      if (!revealed && (Date.now() >= deadline || (players.length > 0 && ans.length >= players.length))) reveal(i);
    });
  }

  async function reveal(i) {
    if (revealed) return; revealed = true;
    stopLoops(); phase = "reveal";
    const q = qs[i];
    await setState("reveal", i);
    await refreshPlayers();
    const ans = await answersFor(q.id);
    const counts = q.options.map((_, j) => ans.filter(a => a.chosen === j).length);
    const right = counts[q.correct];
    const last = i >= qs.length - 1;
    main.replaceChildren(
      h("div", { class: "qtext" }, q.text),
      h("div", { class: "answers" }, q.options.map((o, j) => {
        const b = ansButton(j, o, { disabled: true, class: "ans ans-" + j + (j === q.correct ? " win" : " dim") });
        b.append(h("span", { class: "cnt" }, counts[j]));
        return b;
      })),
      h("div", { class: "row between" },
        h("h2", null, right + " van " + players.length + " juist"),
        h("button", { class: "btn big", type: "button", onclick: () => last ? finish() : scoreboard(i) }, last ? "Eindstand" : "Tussenstand")));
  }

  function scoreboard(i) {
    phase = "board";
    setTop("Tussenstand na vraag " + (i + 1));
    main.replaceChildren(
      h("h1", { style: { textAlign: "center" } }, "Tussenstand"),
      h("div", { class: "board-list" }, players.slice(0, 5).map((p, k) => h("div", { class: "board-row" },
        h("span", { class: "medal num" + (k < 3 ? " m" + (k + 1) : "") }, k + 1), h("span", { class: "n" }, p.name), h("span", { class: "s" }, fmtNum(p.score))))),
      h("div", { class: "row", style: { justifyContent: "center" } }, h("button", { class: "btn big", type: "button", onclick: () => question(i + 1) }, "Volgende vraag")));
  }

  async function finish() {
    await setState("finished", idx);
    await refreshPlayers();
    setTop(quiz.title + " · Eindstand");
    top.lastChild.replaceWith(h("button", { class: "btn ghost small", type: "button", onclick: () => { stopLoops(); teacherHome(); } }, "Sluiten"));
    main.replaceChildren(
      h("h1", { style: { textAlign: "center" } }, "Eindstand"),
      podium(players),
      h("div", { class: "board-list" }, players.slice(3, 10).map((p, k) => h("div", { class: "board-row" },
        h("span", { class: "medal num" }, k + 4), h("span", { class: "n" }, p.name), h("span", { class: "s" }, fmtNum(p.score))))));
  }

  lobby();
}

/* ---------- Scores ---------- */
let scoreFilter = "all", scoreSort = { key: "total", dir: -1 };
async function scoresView() {
  loadingPage();
  let d, attempts, students, stats;
  try {
    d = await fetchAll();
    attempts = must(await sb.from("kq_attempts").select("id, quiz_id, student_id, mode, score, started_at, finished_at").eq("owner_id", me.id).limit(10000));
    students = must(await sb.from("kq_students").select("id, name").eq("owner_id", me.id).order("name"));
    stats = must(await sb.rpc("kq2_attempt_stats").limit(10000));
  } catch (e) { mount(teacherShell(h("p", { class: "err" }, "Laden mislukt: " + e.message))); return; }
  const rightOf = {};
  for (const s of stats) rightOf[s.attempt_id] = s.n_right;
  const qTotal = {};
  for (const q of d.quizzes) qTotal[q.id] = qCount(q);
  const pct = (r, t) => t ? Math.round(100 * r / t) + "%" : "–";

  const playedQuizIds = new Set(attempts.map(a => a.quiz_id));
  const quizzes = d.quizzes.filter(q => q.owner_id === me.id || playedQuizIds.has(q.id));
  const groupOf = q => q.owner_id === me.id ? q.subject_id : "shared";
  const groups = d.subjects.filter(s => s.owner_id === me.id).map(s => ({ id: s.id, name: s.name }));
  if (quizzes.some(q => q.owner_id !== me.id)) groups.push({ id: "shared", name: "Gedeelde quizzen" });

  // best attempt per student per quiz
  const best = {};
  for (const a of attempts) {
    const k = a.student_id + "|" + a.quiz_id;
    if (!best[k] || a.score > best[k].score) best[k] = a;
  }
  let scope;
  if (scoreFilter === "all") scope = quizzes;
  else if (scoreFilter.startsWith("g:")) scope = quizzes.filter(q => groupOf(q) === scoreFilter.slice(2));
  else scope = quizzes.filter(q => q.id === scoreFilter.slice(2));
  if (!scope.length && scoreFilter !== "all") { scoreFilter = "all"; return scoresView(); }
  const single = scoreFilter.startsWith("q:") ? scope[0] : null;

  const rows = students.map(s => {
    const mine = scope.map(q => best[s.id + "|" + q.id]).filter(Boolean);
    const total = mine.reduce((t, a) => t + a.score, 0);
    const right = mine.reduce((t, a) => t + (rightOf[a.id] || 0), 0);
    const asked = mine.reduce((t, a) => t + (qTotal[a.quiz_id] || 0), 0);
    const r = { id: s.id, name: s.name, total, played: mine.length, avg: mine.length ? total / mine.length : 0,
      right, asked, ratio: asked ? right / asked : -1 };
    if (single) { const a = mine[0]; r.attempt = a; r.status = !a ? "niet gemaakt" : a.finished_at ? "afgewerkt" : "bezig"; r.mode = a ? (a.mode === "live" ? "Live" : "Zelfstandig") : ""; r.when = a ? a.started_at : ""; }
    return r;
  });
  const rankSorted = rows.slice().sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
  rankSorted.forEach((r, i) => { r.rank = (i > 0 && rankSorted[i - 1].total === r.total) ? rankSorted[i - 1].rank : i + 1; });
  const k = scoreSort.key, dir = scoreSort.dir;
  rows.sort((a, b) => { const x = a[k], y = b[k]; return (typeof x === "string" ? x.localeCompare(y) : (x || 0) - (y || 0)) * dir || a.rank - b.rank; });

  const sel = h("select", { class: "input", style: { width: "auto", minWidth: "240px", maxWidth: "100%" }, id: "score-filter", onchange: e => { scoreFilter = e.target.value; scoresView(); } },
    h("option", { value: "all", selected: scoreFilter === "all" }, "Algemeen klasklassement"),
    groups.map(g => h("optgroup", { label: g.name },
      h("option", { value: "g:" + g.id, selected: scoreFilter === "g:" + g.id }, "Heel het vak " + g.name),
      quizzes.filter(q => groupOf(q) === g.id).map(q => h("option", { value: "q:" + q.id, selected: scoreFilter === "q:" + q.id }, "Quiz: " + q.title)))));
  const scopeName = scoreFilter === "all" ? "Algemeen" : single ? single.title : (groups.find(g => "g:" + g.id === scoreFilter) || {}).name;

  const th = (key, label, r) => h("th", { class: r ? "r" : null, scope: "col", "aria-sort": scoreSort.key === key ? (scoreSort.dir > 0 ? "ascending" : "descending") : null,
    onclick: () => { scoreSort = { key, dir: scoreSort.key === key ? -scoreSort.dir : (key === "name" ? 1 : -1) }; scoresView(); } }, label + (scoreSort.key === key ? (scoreSort.dir > 0 ? " ▲" : " ▼") : ""));

  const table = h("div", { class: "tablewrap" }, h("table", null,
    h("thead", null, h("tr", null, th("rank", "#"), th("name", "Leerling"), th("total", "Punten", true), th("ratio", "Juist", true),
      single ? [th("mode", "Manier"), th("status", "Status"), th("when", "Wanneer"), h("th", null, "")] : [th("played", "Gespeeld", true), th("avg", "Gemiddelde per quiz", true)])),
    h("tbody", null, rows.length ? rows.map(r => h("tr", null,
      h("td", null, h("span", { class: "medal" + (r.rank <= 3 && r.total > 0 ? " m" + r.rank : "") }, r.rank)),
      h("td", null, r.name), h("td", { class: "r" }, fmtNum(r.total)),
      h("td", { class: "r" }, r.asked ? [h("b", null, r.right + " / " + r.asked), h("span", { class: "muted" }, " · " + pct(r.right, r.asked))] : "–"),
      single ? [h("td", null, r.mode), h("td", null, h("span", { class: "chip" + (r.status === "afgewerkt" ? "" : r.status === "bezig" ? " warn" : " grey") }, r.status)),
        h("td", { class: "muted" }, fmtDate(r.when)),
        h("td", null, r.attempt ? confirmBtn("Poging wissen", async () => {
          try { must(await sb.from("kq_attempts").delete().eq("student_id", r.id).eq("quiz_id", single.id).eq("owner_id", me.id)); toast("Poging gewist. " + r.name + " kan de quiz opnieuw maken."); scoresView(); } catch (e) { toast(e.message, true); }
        }, "btn danger small") : "")]
        : [h("td", { class: "r" }, r.played + " / " + scope.length), h("td", { class: "r" }, r.played ? fmtNum(r.avg) : "–")]))
      : h("tr", null, h("td", { colspan: "8", class: "muted" }, "Nog geen leerlingen of scores.")))));

  const exportCsv = () => {
    const head = single ? ["Plaats", "Leerling", "Punten", "Juist", "Van", "Percentage", "Manier", "Status", "Wanneer"]
      : ["Plaats", "Leerling", "Punten", "Juist", "Van", "Percentage", "Gespeeld", "Aantal quizzen", "Gemiddelde"];
    const lines = [head].concat(rankSorted.map(r => {
      const base = [r.rank, r.name, r.total, r.asked ? r.right : "", r.asked || "", r.asked ? pct(r.right, r.asked) : ""];
      return single ? base.concat([r.mode, r.status, r.when ? fmtDate(r.when) : ""]) : base.concat([r.played, scope.length, Math.round(r.avg)]);
    }));
    const csv = "﻿" + lines.map(l => l.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(";")).join("\r\n");
    const a = h("a", { href: URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })), download: "klasquiz-" + (scopeName || "scores").replace(/[^\w-]+/g, "_") + ".csv" });
    document.body.append(a); a.click(); a.remove();
  };
  const showPodium = () => {
    const ov = h("div", { class: "overlay" }, h("div", { class: "stage" },
      h("div", { class: "stage-top" }, h("span", { class: "grow" }, "Klasklassement · " + scopeName), h("button", { class: "btn ghost small", type: "button", onclick: () => ov.remove() }, "Sluiten")),
      h("div", { class: "stage-main" }, h("h1", { style: { textAlign: "center" } }, "De beste van de klas"),
        podium(rankSorted.filter(r => r.total > 0).map(r => ({ name: r.name, score: r.total }))),
        h("div", { class: "board-list" }, rankSorted.filter(r => r.total > 0).slice(3, 10).map((r, i) => h("div", { class: "board-row" },
          h("span", { class: "medal num" }, i + 4), h("span", { class: "n" }, r.name), h("span", { class: "s" }, fmtNum(r.total))))))));
    document.body.append(ov);
  };

  mount(teacherShell([
    h("div", { class: "page-head" }, h("div", { class: "stack tight" }, h("p", { class: "label" }, "Scores"), h("h1", null, scopeName)),
      h("div", { class: "row" }, sel, h("button", { class: "btn", type: "button", onclick: exportCsv }, "Exporteer naar Excel"), h("button", { class: "btn primary", type: "button", onclick: showPodium }, "Toon podium op bord"))),
    h("p", { class: "small muted", style: { marginBottom: "14px" } }, single
      ? "Per quiz telt de beste poging. Live: 500 tot 1000 punten per juist antwoord, afhankelijk van de snelheid. Zelfstandig: 750 punten per juist antwoord."
      : "Totaal van de beste poging per quiz. ‘Juist’ telt de juiste antwoorden op alle vragen van de gespeelde quizzen. Een gemiste quiz telt als 0 punten. Het gemiddelde rekent alleen de gespeelde quizzen mee, dat is eerlijker voor wie afwezig was."),
    table
  ]));
}

boot();
</script>
